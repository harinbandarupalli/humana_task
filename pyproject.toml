# Project Metadata & Dependencies
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-postgres-orchestrator"
version = "0.1.0"
description = "Production-ready LangGraph Orchestrator with PostgreSQL State Checkpointing and Flyway-managed Migrations"
authors = [{ name = "Orchestrator Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.20",
    "langgraph-checkpoint-postgres>=2.0.2",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
